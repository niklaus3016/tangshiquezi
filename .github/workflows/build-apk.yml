name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Build web
      run: npm run build
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Generate keystore for release signing
      run: |
        keytool -genkey -v \
          -keystore ${{ github.workspace }}/tangshiquezi.keystore \
          -alias tangshiquezi \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=TangShiQueZi, OU=Dev, O=TangShiQueZi, L=Shenzhen, S=Guangdong, C=CN" \
          -storepass ${{ secrets.KEYSTORE_PASSWORD || 'password123' }} \
          -keypass ${{ secrets.KEY_PASSWORD || 'password123' }}
    
    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug
    
    - name: Build Release APK
      working-directory: android
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/tangshiquezi.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'password123' }}
        KEY_ALIAS: tangshiquezi
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'password123' }}
      run: ./gradlew assembleRelease
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: tangshiquezi-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: tangshiquezi-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk