apply plugin: 'com.android.application'

// 删除旧的自适应图标配置文件（保留 mipmap-anydpi-v26）
task deleteAdaptiveIconConfigs {
    doLast {
        def filesToDelete = [
            'src/main/res/drawable/ic_launcher_background.xml',
            'src/main/res/drawable-v24/ic_launcher_foreground.xml',
            'src/main/res/values/ic_launcher_background.xml',  // 删除重复的颜色定义文件
            // 删除所有分辨率的损坏PNG文件
            'src/main/res/mipmap-mdpi/ic_launcher_foreground.png',
            'src/main/res/mipmap-hdpi/ic_launcher_foreground.png',
            'src/main/res/mipmap-xhdpi/ic_launcher_foreground.png',
            'src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png',
            'src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png',
            'src/main/res/drawable/splash.png',
            'src/main/res/drawable-land/splash.png',
            'src/main/res/drawable-land-mdpi/splash.png',
            'src/main/res/drawable-port-mdpi/splash.png'
        ]
        
        filesToDelete.each { filePath ->
            def fileObj = file(filePath)
            if (fileObj.exists()) {
                fileObj.delete()
                println "Deleted: $filePath"
            }
        }
    }
}

// 创建缺失的资源文件（在删除任务之后执行）
task createMissingResources {
    doLast {
        // adaptive icon 配置
        def launcherXml = '''<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@drawable/ic_launcher_foreground"/>
</adaptive-icon>'''
        
        // 前景图标（矢量图形）
        def foregroundXml = '''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#8b0000"
        android:pathData="M54,5 L60,40 L97,40 L65,62 L76,97 L54,75 L32,97 L43,62 L11,40 L48,40 Z"/>
</vector>'''
        
        // 颜色配置
        def colorsXml = '''<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#f4ecd8</color>
</resources>'''
        
        // 启动画面（使用颜色背景）
        def splashXml = '''<?xml version="1.0" encoding="utf-8"?>
<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
    <item android:drawable="@color/ic_launcher_background"/>
</layer-list>'''
        
        // 创建目录和文件
        def filesToCreate = [
            ['src/main/res/mipmap-anydpi-v26/ic_launcher.xml', launcherXml],
            ['src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml', launcherXml],
            ['src/main/res/drawable/ic_launcher_foreground.xml', foregroundXml],
            ['src/main/res/values/colors.xml', colorsXml],
            ['src/main/res/drawable/splash.xml', splashXml],
            ['src/main/res/drawable-land/splash.xml', splashXml]
        ]
        
        filesToCreate.each { filePath, content ->
            def fileObj = file(filePath)
            if (!fileObj.exists()) {
                fileObj.parentFile.mkdirs()
                fileObj.write(content)
                println "Created: $filePath"
            }
        }
    }
}

// 在构建前执行任务（先删除旧文件，再创建新文件）
preBuild.dependsOn deleteAdaptiveIconConfigs
createMissingResources.dependsOn deleteAdaptiveIconConfigs
preBuild.dependsOn createMissingResources

android {
    namespace = "com.tangshiquezi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tangshiquezi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "V1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: `https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61`
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // 确保使用AndroidX
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    
    // 添加签名配置
    signingConfigs {
        release {
            storeFile file('../my-release-key.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            keyAlias 'tangshiquezi'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            v1SigningEnabled true
            v2SigningEnabled true
            storeType 'JKS'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
